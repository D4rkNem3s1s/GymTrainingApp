<header class="app-header">
  <a routerLink="/" class="brand">
    <i class="fa-solid fa-dumbbell brand-icon"></i>
    <span class="brand-title">Mis Rutinas del Gym</span>
  </a>
  <button (click)="themeService.toggleTheme()" class="theme-toggle-btn"
    [attr.aria-label]="themeService.isDarkMode() ? 'Modo claro' : 'Modo oscuro'">
    @if (themeService.isDarkMode()) {
    <i class="fa-solid fa-sun icon-sun"></i>
    } @else {

    <i class="fa-solid fa-moon icon-moon"></i>
    }
  </button>
</header>
<main class="app-content">
  <router-outlet></router-outlet>
</main>
